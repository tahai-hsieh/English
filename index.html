<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大海的學測英文單字庫</title>

    <meta name="apple-mobile-web-app-title" content="大海的學測英文單字庫">
    <meta name="application-name" content="大海的學測英文單字庫">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icon_English.png">

    <link rel="icon" id="dynamic-favicon" type="image/png" href="icon_English.png">

    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E5%A4%A7%E6%B5%B7%E7%9A%84%E5%AD%B8%E6%88%90%E8%8B%B1%E6%96%87%E5%96%AE%E5%AD%97%E5%BA%AB%22%2C%22short_name%22%3A%22%E5%A4%A7%E6%B5%B7%E7%9A%84%E5%AD%B8%E6%88%90%E8%8B%B1%E6%96%87%E5%96%AE%E5%AD%97%E5%BA%AB%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f6f9%22%2C%22theme_color%22%3A%22%233498db%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22icon_English.png%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: pan-y;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 24px 12px;
            min-height: 100vh;
        }

        /* 登入遮罩 */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 16px;
            text-align: center;
            outline: none;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ebf5fb;
            padding: 8px 14px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 14px;
            color: #2980b9;
        }

        .logout-btn {
            background: none;
            border: 1px solid #2980b9;
            color: #2980b9;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 12px;
            color: #2c3e50;
            font-size: 24px;
            word-break: break-word;
        }

        .sync-status {
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .input-group input, .input-group select {
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        #wordInput { flex: 2; min-width: 140px; }
        #posSelect { flex: 1; min-width: 110px; }
        #defInput { flex: 3; min-width: 160px; }

        .search-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            align-items: center;
        }

        #searchInput {
            flex: 1;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #3498db;
            border-radius: 6px;
            outline: none;
        }

        .btn {
            padding: 10px 16px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            text-align: center;
        }

        .btn-primary { background-color: #3498db; color: #fff; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #6c757d; color: #fff; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-preview { background-color: #2ecc71; color: #fff; }
        .btn-preview:hover { background-color: #27ae60; }
        .btn-export { background-color: #e67e22; color: #fff; }
        .btn-export:hover { background-color: #d35400; }
        .btn-history { background-color: #8e44ad; color: #fff; }
        .btn-history:hover { background-color: #732d91; }
        .btn-warning { background-color: #f39c12; color: #fff; }
        .btn-warning:hover { background-color: #d68910; }
        .btn-info { background-color: #1abc9c; color: #fff; }
        .btn-info:hover { background-color: #16a085; }

        .action-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .alphabet-section {
            margin-bottom: 24px;
        }

        .alphabet-header {
            font-size: 20px;
            font-weight: 700;
            color: #e74c3c;
            border-bottom: 2px solid #e74c3c;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }

        .word-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .word-card-item {
            display: flex;
            align-items: stretch;
            background: #fff;
            border: 1px solid #000;
            border-radius: 2px;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.2s, transform 0.2s;
        }

        .word-card-item.dragging {
            opacity: 0.4;
            background-color: #e3f2fd;
        }

        .word-card-item.drag-over {
            border: 2px dashed #3498db !important;
        }

        .word-card-item.highlight {
            background-color: #fff9c4 !important;
            border: 2px solid #f39c12 !important;
        }

        .drag-bar {
            width: 32px;
            background: #f8fafc;
            border-right: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            cursor: grab;
            font-size: 16px;
            flex-shrink: 0;
            touch-action: none;
        }

        .word-table {
            flex: 1;
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
        }

        .word-table td {
            border: 1px solid #000;
            padding: 8px 12px;
            font-size: 15px;
            vertical-align: middle;
            word-break: break-word;
        }

        .col-word {
            width: 32%;
            font-size: 18px;
            font-weight: 600;
            color: #000;
            background-color: #fff;
        }

        .col-pos {
            width: 28%;
            color: #000;
            font-weight: 500;
        }

        .col-def {
            width: 30%;
            color: #000;
        }

        .col-ops {
            width: 10%;
            text-align: center;
            border: 1px solid #000;
        }

        .delete-btn {
            background-color: transparent;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 48px;
        }
        .delete-btn:hover { background-color: #e74c3c; color: #fff; }

        /* 彈窗樣式 */
        #conflictModal, #variantModal, #previewModal, #historyModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .history-card {
            max-width: 820px;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 18px 20px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .conflict-box {
            background: #fdfefe;
            border: 1px solid #dcdde1;
            padding: 14px;
            border-radius: 6px;
            margin: 12px 0;
        }

        .conflict-word-title {
            font-size: 17px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .def-radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            cursor: pointer;
            border-bottom: 1px dashed #eee;
        }

        /* 歷史紀錄專用表格樣式 */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .history-table th, .history-table td {
            border: 1px solid #e0e0e0;
            padding: 10px 8px;
            text-align: left;
            word-break: break-word;
        }

        .history-table th {
            background-color: #f8fafc;
            font-weight: 600;
        }

        .restore-btn {
            background-color: #8e44ad;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .restore-btn:hover { background-color: #732d91; }

        .pdf-group-title {
            font-size: 18px;
            font-weight: bold;
            color: #e74c3c;
            padding: 12px 0 6px 0;
            border-bottom: 2px solid #e74c3c;
            margin-bottom: 8px;
        }

        .pdf-word-block {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
            margin-bottom: 10px;
            page-break-inside: avoid;
        }

        .pdf-word-block td {
            border: 1px solid #000;
            padding: 8px 10px;
            vertical-align: middle;
            font-size: 14px;
        }

        .empty-tip {
            text-align: center;
            color: #999;
            padding: 20px 0;
        }

        @media (max-width: 600px) {
            body { padding: 12px 8px; }
            .container { padding: 16px; }
            h1 { font-size: 20px; }
            .input-group { flex-direction: column; gap: 8px; }
            #wordInput, #posSelect, #defInput, .input-group .btn-primary { width: 100%; min-width: 0; }
            .search-group { flex-direction: column; gap: 8px; }
            #searchInput, .search-group .btn { width: 100%; }
            .action-bar { flex-direction: column; }
            .action-bar .btn { width: 100%; }
            .col-word { font-size: 16px; width: 28%; }
            .col-pos { width: 34%; }
            .col-def { width: 26%; }
            .col-ops { width: 12%; }
            .word-table td { padding: 6px 6px; font-size: 13px; }
            .drag-bar { width: 28px; font-size: 14px; }
            .history-table th, .history-table td { padding: 6px 4px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2>請輸入使用者名稱</h2>
        <input type="text" id="usernameInput" placeholder="請輸入『使用者名稱』" autofocus>
        <button class="btn btn-primary" onclick="handleLogin()">登入</button>
    </div>
</div>

<div class="container">
    <div class="user-bar">
        <span>目前使用者：<strong id="currentUsername"></strong></span>
        <button class="logout-btn" onclick="handleLogout()">登出</button>
    </div>

    <h1>大海的學測英文單字庫</h1>
    <div class="sync-status" id="syncStatus">雲端狀態：連線中...</div>

    <div class="input-group">
        <input 
            type="email" 
            id="wordInput" 
            placeholder="請輸入『英文單字』"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="next"
        >
        <select id="posSelect">
            <option value="n.">n. 名詞</option>
            <option value="v.">v. 動詞</option>
            <option value="adj.">adj. 形容詞</option>
            <option value="adv.">adv. 副詞</option>
            <option value="prep.">prep. 介系詞</option>
            <option value="conj.">conj. 連接詞</option>
            <option value="phr.">phr. 片語</option>
        </select>
        <input 
            type="text" 
            id="defInput" 
            placeholder="請輸入『中文解釋』"
            lang="zh-TW"
            enterkeyhint="done"
        >
        <button class="btn btn-primary" onclick="handleAddAction()">新增</button>
    </div>

    <div class="search-group">
        <input 
            type="email" 
            id="searchInput" 
            placeholder="請輸入『搜尋單字』"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="search"
        >
        <button class="btn btn-info" onclick="handleSearch()">搜尋</button>
    </div>

    <div class="action-bar">
        <button class="btn btn-secondary" onclick="autoGroupAndSort()">重新自動排列</button>
        <button class="btn btn-preview" onclick="openPreview()">預覽輸出</button>
        <button class="btn btn-export" onclick="exportPDF()">輸出成 PDF</button>
        <button class="btn btn-history" onclick="openHistory()">歷史紀錄</button>
    </div>

    <div id="groupedWordContainer"></div>
</div>

<div id="conflictModal">
    <div class="modal-card">
        <div class="modal-header">
            <h2 style="font-size: 18px; color: #e67e22;">該單字已存在，是否要新增？</h2>
        </div>
        <div class="modal-body">
            <div class="conflict-word-title" id="conflictWordTitle"></div>
            <p style="font-size: 14px; color: #555; margin-bottom: 6px;">目前已有之詞性與解釋：</p>
            <div class="conflict-box" id="existingDefsList"></div>
            <p style="font-size: 14px; color: #27ae60; font-weight: bold; margin-top: 10px;">
                即將輸入的內容：<span id="newEntryPreview" style="color: #333; font-weight: normal;"></span>
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeConflictModal()">取消</button>
            <button class="btn btn-warning" onclick="confirmCorrect()">更正</button>
            <button class="btn btn-primary" onclick="confirmAddDuplicate()">新增</button>
        </div>
    </div>
</div>

<div id="variantModal">
    <div class="modal-card">
        <div class="modal-header">
            <h2 style="font-size: 18px; color: #3498db;">該單字有相近的單字，是否新增至該單字列？</h2>
        </div>
        <div class="modal-body">
            <div class="conflict-word-title" id="variantWordTitle"></div>
            <p style="font-size: 14px; color: #555; margin-bottom: 6px;">該單字目前已有的詞性與解釋：</p>
            <div class="conflict-box" id="variantDefsList"></div>
            <p style="font-size: 14px; color: #2980b9; font-weight: bold; margin-top: 10px;">
                欲新增之變形單字：<span id="variantNewPreview" style="color: #333; font-weight: normal;"></span>
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="confirmVariantExtra()">否，額外新增</button>
            <button class="btn btn-primary" onclick="confirmVariantMerge()">是，新增至該單字</button>
        </div>
    </div>
</div>

<div id="historyModal">
    <div class="modal-card history-card">
        <div class="modal-header">
            <h2>操作歷史紀錄</h2>
        </div>
        <div class="modal-body">
            <div id="historyListContainer"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeHistory()">關閉</button>
        </div>
    </div>
</div>

<div id="previewModal">
    <div class="modal-card">
        <div class="modal-header">
            <h2>預覽清單（唯讀模式）</h2>
        </div>
        <div class="modal-body" id="previewContentArea">
            <h3 style="text-align: center; margin-bottom: 15px;">大海的學測英文單字庫</h3>
            <div id="previewGroupedContainer"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closePreview()">關閉預覽</button>
        </div>
    </div>
</div>

<div id="pdfExportContainer" style="display: none;"></div>

<script>
    const DB_URL = "https://english-tahai-default-rtdb.asia-southeast1.firebasedatabase.app/words.json";
    const HISTORY_URL = "https://english-tahai-default-rtdb.asia-southeast1.firebasedatabase.app/history.json";

    /* 使用者驗證 */
    const ALLOWED_USERS = ["120105", "120110"];
    let currentUser = localStorage.getItem("tahai_user") || "";

    function checkAuth() {
        if (ALLOWED_USERS.includes(currentUser)) {
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("currentUsername").textContent = currentUser;
        } else {
            document.getElementById("loginOverlay").style.display = "flex";
            document.getElementById("usernameInput").focus();
        }
    }

    function handleLogin() {
        const username = document.getElementById("usernameInput").value.trim();
        if (ALLOWED_USERS.includes(username)) {
            currentUser = username;
            localStorage.setItem("tahai_user", currentUser);
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("currentUsername").textContent = currentUser;
        } else {
            alert("使用者名稱錯誤，請重新輸入！");
            document.getElementById("usernameInput").value = "";
            document.getElementById("usernameInput").focus();
        }
    }

    function handleLogout() {
        localStorage.removeItem("tahai_user");
        currentUser = "";
        location.reload();
    }

    document.getElementById("usernameInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            handleLogin();
        }
    });

    checkAuth();

    function setCircularFavicon(imageUrl) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = imageUrl;
        img.onload = () => {
            const canvas = document.createElement("canvas");
            const size = 64;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");

            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(img, 0, 0, size, size);

            const dynamicFavicon = document.getElementById("dynamic-favicon");
            if (dynamicFavicon) {
                dynamicFavicon.href = canvas.toDataURL("image/png");
            }
        };
    }
    setCircularFavicon("icon_English.png");

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                const CACHE_NAME = 'vocab-cache-v17';
                const ASSETS = [
                    './',
                    './index.html',
                    './icon_English.png',
                    'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'
                ];
                self.addEventListener('install', (e) => {
                    e.waitUntil(
                        caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS)).then(() => self.skipWaiting())
                    );
                });
                self.addEventListener('activate', (e) => {
                    e.waitUntil(
                        caches.keys().then((keys) => {
                            return Promise.all(keys.map((k) => { if (k !== CACHE_NAME) return caches.delete(k); }));
                        }).then(() => self.clients.claim())
                    );
                });
                self.addEventListener('fetch', (e) => {
                    if (e.request.url.includes('firebasedatabase.app')) {
                        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                    } else {
                        e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
                    }
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch((err) => {
                console.log('SW registration note:', err);
            });
        });
    }

    function normalizeData(rawData) {
        if (!Array.isArray(rawData)) return [];
        return rawData.map(item => {
            if (item.senses && Array.isArray(item.senses)) {
                return {
                    word: item.word,
                    senses: item.senses.map(s => ({
                        pos: s.pos || '',
                        def: s.def || '',
                        form: s.form || ''
                    }))
                };
            }
            return {
                word: item.word,
                senses: [{ pos: item.pos || '', def: item.def || '', form: '' }]
            };
        });
    }

    let words = normalizeData(JSON.parse(localStorage.getItem("vocabularyList")) || []);

    function updateStatus(text, isError = false) {
        const status = document.getElementById("syncStatus");
        status.textContent = text;
        status.style.color = isError ? "#e74c3c" : "#7f8c8d";
    }

    async function saveStorage() {
        localStorage.setItem("vocabularyList", JSON.stringify(words));
        updateStatus("正在同步至雲端...");
        try {
            const res = await fetch(DB_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(words)
            });
            if (res.ok) {
                updateStatus("雲端狀態：已同步完成");
            } else {
                updateStatus("雲端狀態：同步失敗（請檢查 Firebase 權限）", true);
            }
        } catch (err) {
            updateStatus("雲端狀態：離線模式（已暫存本機）");
        }
    }

    async function saveHistoryStorage() {
        localStorage.setItem("vocabularyHistory", JSON.stringify(historyRecords));
        try {
            await fetch(HISTORY_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(historyRecords)
            });
        } catch (err) {
            console.log("History sync error:", err);
        }
    }

    async function loadFromFirebase() {
        updateStatus("雲端狀態：正在從雲端載入資料...");
        try {
            const res = await fetch(DB_URL);
            if (res.ok) {
                const data = await res.json();
                if (data) {
                    const list = Array.isArray(data) ? data : Object.values(data);
                    words = normalizeData(list);
                } else {
                    words = normalizeData(JSON.parse(localStorage.getItem("vocabularyList")) || []);
                }
                localStorage.setItem("vocabularyList", JSON.stringify(words));
                updateStatus("雲端狀態：已連線並同步最新資料");
                renderList();
            } else {
                updateStatus("雲端狀態：讀取失敗，使用本機暫存資料", true);
            }

            const hRes = await fetch(HISTORY_URL);
            if (hRes.ok) {
                const hData = await hRes.json();
                if (hData) {
                    historyRecords = Array.isArray(hData) ? hData : Object.values(hData);
                    localStorage.setItem("vocabularyHistory", JSON.stringify(historyRecords));
                }
            }
        } catch (err) {
            updateStatus("雲端狀態：離線模式，使用本機暫存資料");
        }
    }

    function addHistoryLog(actionType, targetWord, details, beforeState, afterState) {
        const record = {
            id: 'h_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            timestamp: new Date().toLocaleString('zh-TW', { hour12: false }),
            user: currentUser || "未知使用者",
            actionType,
            targetWord,
            details,
            beforeState: beforeState ? JSON.parse(JSON.stringify(beforeState)) : null,
            afterState: afterState ? JSON.parse(JSON.stringify(afterState)) : null
        };
        historyRecords.unshift(record);
        if (historyRecords.length > 200) historyRecords.pop();
        saveHistoryStorage();
    }

    function performSort() {
        words.sort((a, b) => {
            const wordA = a.word.toLowerCase();
            const wordB = b.word.toLowerCase();

            const prefixLen = 3;
            const prefixA = wordA.slice(0, prefixLen);
            const prefixB = wordB.slice(0, prefixLen);

            if (prefixA === prefixB) {
                return wordA.localeCompare(wordB);
            }
            return wordA.localeCompare(wordB);
        });
    }

    function autoGroupAndSort() {
        performSort();
        saveStorage();
        renderList();
    }

    const COMMON_SUFFIXES = [
        'ly', 'ness', 'tion', 'sion', 'able', 'ible', 'al', 'ive',
        'ful', 'ic', 'ment', 'd', 'ed', 'ing', 'er', 'est', 's', 'es',
        'ize', 'ise', 'ity', 'y'
    ];

    function isDerivativeOf(target, base) {
        const t = target.toLowerCase();
        const b = base.toLowerCase();
        if (t === b || t.length <= b.length) return false;

        for (const suffix of COMMON_SUFFIXES) {
            if (t === b + suffix) return true;
            if (b.endsWith('e') && t === b.slice(0, -1) + suffix) return true;
            if (b.endsWith('y') && t === b.slice(0, -1) + 'i' + suffix) return true;
        }
        return false;
    }

    function isWordVariant(w1, w2) {
        const a = w1.toLowerCase();
        const b = w2.toLowerCase();
        if (a === b) return false;

        if (isDerivativeOf(a, b) || isDerivativeOf(b, a)) return true;

        const [shorter, longer] = a.length <= b.length ? [a, b] : [b, a];
        if (shorter.length >= 4) {
            let commonLen = 0;
            while (commonLen < shorter.length && shorter[commonLen] === longer[commonLen]) {
                commonLen++;
            }
            if (commonLen >= shorter.length * 0.8 && (longer.length - commonLen) <= 4) {
                return true;
            }
        }
        return false;
    }

    let pendingEntry = null;
    let pendingVariant = null;

    function handleAddAction() {
        const wordInput = document.getElementById("wordInput");
        const posSelect = document.getElementById("posSelect");
        const defInput = document.getElementById("defInput");

        let rawWord = wordInput.value.trim();
        const pos = posSelect.value;
        const def = defInput.value.trim();

        if (!rawWord || !def) {
            alert("請填寫單字與中文解釋！");
            return;
        }

        const isProperNoun = /(?:（|\()專有名詞(?:）|\))\s*$/.test(def);
        const word = isProperNoun ? rawWord : rawWord.toLowerCase();

        const exactIndex = words.findIndex(w => {
            if (w.word.toLowerCase() === word.toLowerCase()) return true;
            return w.senses.some(s => s.form && s.form.toLowerCase() === word.toLowerCase());
        });

        if (exactIndex !== -1) {
            pendingEntry = { index: exactIndex, word, pos, def };
            showConflictModal(words[exactIndex], pos, def);
            return;
        }

        const variantIndex = words.findIndex(w => isWordVariant(w.word, word));
        if (variantIndex !== -1) {
            pendingVariant = { targetIndex: variantIndex, word, pos, def };
            showVariantModal(words[variantIndex], word, pos, def);
            return;
        }

        const newObj = {
            word: word,
            senses: [{ pos, def, form: '' }]
        };
        words.push(newObj);

        addHistoryLog("新增單字", word, `新增單字【${pos} ${def}】`, null, newObj);

        performSort();
        saveStorage();
        renderList();
        resetInputs();
    }

    function resetInputs() {
        document.getElementById("wordInput").value = "";
        document.getElementById("defInput").value = "";
        document.getElementById("wordInput").focus();
        pendingEntry = null;
        pendingVariant = null;
    }

    function showConflictModal(existingWordObj, newPos, newDef) {
        document.getElementById("conflictWordTitle").textContent = `單字：${existingWordObj.word}`;
        const container = document.getElementById("existingDefsList");
        container.innerHTML = "";

        existingWordObj.senses.forEach((sense, idx) => {
            const label = document.createElement("label");
            label.className = "def-radio-label";
            const formText = (sense.form && sense.form.toLowerCase() !== existingWordObj.word.toLowerCase()) ? `(${sense.form}) ` : '';
            label.innerHTML = `
                <input type="radio" name="replaceSenseIndex" value="${idx}" ${idx === 0 ? 'checked' : ''}>
                <span><strong>${sense.pos} ${formText}</strong>${sense.def}</span>
            `;
            container.appendChild(label);
        });

        document.getElementById("newEntryPreview").textContent = `${newPos} ${newDef}`;
        document.getElementById("conflictModal").style.display = "flex";
    }

    function closeConflictModal() {
        document.getElementById("conflictModal").style.display = "none";
        pendingEntry = null;
    }

    function confirmCorrect() {
        if (!pendingEntry) return;
        const selectedRadio = document.querySelector('input[name="replaceSenseIndex"]:checked');
        const replaceIdx = selectedRadio ? parseInt(selectedRadio.value, 10) : 0;

        const mainWordObj = words[pendingEntry.index];
        const beforeState = JSON.parse(JSON.stringify(mainWordObj));

        const targetSense = mainWordObj.senses[replaceIdx];
        const oldDefText = `${targetSense.pos} ${targetSense.def}`;
        targetSense.pos = pendingEntry.pos;
        targetSense.def = pendingEntry.def;

        addHistoryLog("更正內容", mainWordObj.word, `更正原【${oldDefText}】為【${pendingEntry.pos} ${pendingEntry.def}】`, beforeState, mainWordObj);

        closeConflictModal();
        performSort();
        saveStorage();
        renderList();
        resetInputs();
    }

    function confirmAddDuplicate() {
        if (!pendingEntry) return;
        const mainWordObj = words[pendingEntry.index];
        const beforeState = JSON.parse(JSON.stringify(mainWordObj));

        const isDiffForm = pendingEntry.word.toLowerCase() !== mainWordObj.word.toLowerCase();
        mainWordObj.senses.push({
            pos: pendingEntry.pos,
            def: pendingEntry.def,
            form: isDiffForm ? pendingEntry.word : ''
        });

        addHistoryLog("新增解釋", mainWordObj.word, `為已存在單字新增【${pendingEntry.pos} ${pendingEntry.def}】`, beforeState, mainWordObj);

        closeConflictModal();
        performSort();
        saveStorage();
        renderList();
        resetInputs();
    }

    function showVariantModal(existingWordObj, newWord, newPos, newDef) {
        document.getElementById("variantWordTitle").textContent = `相近的既有單字：${existingWordObj.word}`;
        const container = document.getElementById("variantDefsList");
        container.innerHTML = "";

        existingWordObj.senses.forEach((sense) => {
            const div = document.createElement("div");
            div.style.padding = "4px 0";
            const formText = (sense.form && sense.form.toLowerCase() !== existingWordObj.word.toLowerCase()) ? `(${sense.form}) ` : '';
            div.innerHTML = `• <strong>${sense.pos} ${formText}</strong>${sense.def}`;
            container.appendChild(div);
        });

        document.getElementById("variantNewPreview").textContent = `${newWord} [${newPos} ${newDef}]`;
        document.getElementById("variantModal").style.display = "flex";
    }

    function closeVariantModal() {
        document.getElementById("variantModal").style.display = "none";
        pendingVariant = null;
    }

    function confirmVariantMerge() {
        if (!pendingVariant) return;
        const targetWordObj = words[pendingVariant.targetIndex];
        const beforeState = JSON.parse(JSON.stringify(targetWordObj));

        const oldWord = targetWordObj.word;
        const newWord = pendingVariant.word;

        if (targetWordObj.senses.length > 0 && !targetWordObj.senses[0].form) {
            targetWordObj.senses[0].form = oldWord;
        }

        targetWordObj.senses.push({
            pos: pendingVariant.pos,
            def: pendingVariant.def,
            form: newWord
        });

        if (isDerivativeOf(oldWord, newWord)) {
            targetWordObj.word = newWord;
        }

        addHistoryLog("新增變形詞", targetWordObj.word, `合併變形詞「${newWord}」【${pendingVariant.pos} ${pendingVariant.def}】`, beforeState, targetWordObj);

        closeVariantModal();
        performSort();
        saveStorage();
        renderList();
        resetInputs();
    }

    function confirmVariantExtra() {
        if (!pendingVariant) return;
        const newObj = {
            word: pendingVariant.word,
            senses: [{ pos: pendingVariant.pos, def: pendingVariant.def, form: '' }]
        };
        words.push(newObj);

        addHistoryLog("新增單字", pendingVariant.word, `獨立新增相近詞「${pendingVariant.word}」【${pendingVariant.pos} ${pendingVariant.def}】`, null, newObj);

        closeVariantModal();
        performSort();
        saveStorage();
        renderList();
        resetInputs();
    }

    function handleSearch() {
        const searchInput = document.getElementById("searchInput");
        const query = searchInput.value.trim().toLowerCase();

        document.querySelectorAll(".word-card-item").forEach(el => el.classList.remove("highlight"));

        if (!query) {
            renderList();
            return;
        }

        const matchedIndex = words.findIndex(w => {
            if (w.word.toLowerCase() === query) return true;
            return w.senses.some(s => s.form && s.form.toLowerCase() === query);
        });

        if (matchedIndex === -1) {
            alert("很抱歉，單字庫裡並無此單字！");
            return;
        }

        const targetElement = document.querySelector(`.word-card-item[data-index="${matchedIndex}"]`);
        if (targetElement) {
            targetElement.scrollIntoView({ behavior: "smooth", block: "center" });
            targetElement.classList.add("highlight");
            setTimeout(() => {
                targetElement.classList.remove("highlight");
            }, 3000);
        }
    }

    let isComposing = false;
    function handleCompositionStart() { isComposing = true; }
    function handleCompositionEnd() { isComposing = false; }

    function handleKeyDown(e) {
        if (e.isComposing || isComposing || e.keyCode === 229) return;
        if (e.key === "Enter") {
            e.preventDefault();
            handleAddAction();
        }
    }

    const wordInputEl = document.getElementById("wordInput");
    const defInputEl = document.getElementById("defInput");
    [wordInputEl, defInputEl].forEach((input) => {
        input.addEventListener("compositionstart", handleCompositionStart);
        input.addEventListener("compositionend", handleCompositionEnd);
        input.addEventListener("keydown", handleKeyDown);
    });

    const searchInputEl = document.getElementById("searchInput");
    searchInputEl.addEventListener("compositionstart", handleCompositionStart);
    searchInputEl.addEventListener("compositionend", handleCompositionEnd);
    searchInputEl.addEventListener("keydown", (e) => {
        if (e.isComposing || isComposing || e.keyCode === 229) return;
        if (e.key === "Enter") {
            e.preventDefault();
            handleSearch();
        }
    });

    function deleteSenseItem(wordIndex, senseIndex) {
        const targetWord = words[wordIndex];
        if (!targetWord || !targetWord.senses[senseIndex]) return;

        const sense = targetWord.senses[senseIndex];
        const displayWord = sense.form ? `${targetWord.word} (${sense.form})` : targetWord.word;
        const confirmMsg = `確定要刪除「${displayWord}」的【${sense.pos} ${sense.def}】嗎？`;

        if (!confirm(confirmMsg)) {
            return;
        }

        const beforeState = JSON.parse(JSON.stringify(targetWord));

        targetWord.senses.splice(senseIndex, 1);
        let afterState = null;
        if (targetWord.senses.length === 0) {
            words.splice(wordIndex, 1);
            afterState = null;
        } else {
            afterState = targetWord;
        }

        addHistoryLog("刪除項目", targetWord.word, `刪除【${sense.pos} ${sense.def}】`, beforeState, afterState);

        saveStorage();
        renderList();
    }

        if (historyRecords.length === 0) {
            container.innerHTML = '<div class="empty-tip">目前尚無歷史操作紀錄。</div>';

    function restoreRecord(recordIndex) {
        const record = historyRecords[recordIndex];
        if (!record) return;

        const confirmRestore = confirm(`確定要恢復此筆紀錄嗎？\n[${record.timestamp}] ${record.user} ${record.actionType}：${record.details}\n（將會只還原該筆單字至異動前的狀態）`);
        if (!confirmRestore) return;

        const before = record.beforeState;
        const after = record.afterState;
        const targetWord = record.targetWord.toLowerCase();

        const currentIndex = words.findIndex(w => w.word.toLowerCase() === targetWord);

        if (!before && after) {
            if (currentIndex !== -1) {
                words.splice(currentIndex, 1);
            }
        } else if (before && !after) {
            if (currentIndex !== -1) {
                words[currentIndex] = JSON.parse(JSON.stringify(before));
            } else {
                words.push(JSON.parse(JSON.stringify(before)));
            }
        } else if (before && after) {
            if (currentIndex !== -1) {
                words[currentIndex] = JSON.parse(JSON.stringify(before));
            } else {
                words.push(JSON.parse(JSON.stringify(before)));
            }
        }

        addHistoryLog("恢復紀錄", record.targetWord, `恢復了 [${record.timestamp}] 之操作：${record.details}`, null, null);

        performSort();
        saveStorage();
        renderList();
        openHistory();
        alert("已成功恢復該筆紀錄！");
    }

    function getGroupedWords() {
        const groups = {};
        words.forEach((item, index) => {
            const firstChar = (item.word.trim().charAt(0) || '#').toUpperCase();
            const letter = /^[A-Z]$/.test(firstChar) ? firstChar : '#';
            if (!groups[letter]) {
                groups[letter] = [];
            }
            groups[letter].push({ ...item, originalIndex: index });
        });
        return groups;
    }

    function formatPosColumn(itemWord, sense, hasVariantInGroup) {
        const form = (sense.form || '').trim();
        const effectiveForm = (form !== '' && form.toLowerCase() !== itemWord.toLowerCase()) ? form : '';

        if (hasVariantInGroup) {
            const displayForm = effectiveForm || itemWord;
            return `${sense.pos} ( ${displayForm} )`;
        }

        if (effectiveForm !== '') {
            return `${sense.pos} ( ${effectiveForm} )`;
        }
        return sense.pos;
    }

    function calculatePosRowspans(item) {
        const itemWord = item.word;
        const senses = item.senses;
        const hasVariantInGroup = senses.some(s => {
            const f = (s.form || '').trim();
            return f !== '' && f.toLowerCase() !== itemWord.toLowerCase();
        });

        const result = [];
        let i = 0;
        while (i < senses.length) {
            const currentPosText = formatPosColumn(itemWord, senses[i], hasVariantInGroup);
            let count = 1;
            while (i + count < senses.length) {
                const nextPosText = formatPosColumn(itemWord, senses[i + count], hasVariantInGroup);
                if (nextPosText === currentPosText) {
                    count++;
                } else {
                    break;
                }
            }
            result.push({ text: currentPosText, rowspan: count });
            for (let k = 1; k < count; k++) {
                result.push({ text: currentPosText, rowspan: 0 });
            }
            i += count;
        }
        return result;
    }

    function renderList() {
        const container = document.getElementById("groupedWordContainer");
        container.innerHTML = "";

        if (words.length === 0) {
            container.innerHTML = '<div class="empty-tip">目前尚無單字，請從上方輸入新增。</div>';
            return;
        }

        const groups = getGroupedWords();
        const sortedLetters = Object.keys(groups).sort((a, b) => {
            if (a === '#') return 1;
            if (b === '#') return -1;
            return a.localeCompare(b);
        });

        sortedLetters.forEach((letter) => {
            const section = document.createElement("div");
            section.className = "alphabet-section";

            const header = document.createElement("div");
            header.className = "alphabet-header";
            header.textContent = letter;
            section.appendChild(header);

            const ul = document.createElement("ul");
            ul.className = "word-list";

            groups[letter].forEach((item) => {
                const li = document.createElement("li");
                li.className = "word-card-item";
                li.draggable = true;
                li.dataset.index = item.originalIndex;

                const totalRows = item.senses.length;
                const posGroups = calculatePosRowspans(item);
                let rowsHtml = '';

                item.senses.forEach((sense, sIdx) => {
                    rowsHtml += '<tr>';

                    if (sIdx === 0) {
                        rowsHtml += `<td class="col-word" rowspan="${totalRows}">${item.word}</td>`;
                    }

                    const posInfo = posGroups[sIdx];
                    if (posInfo.rowspan > 0) {
                        rowsHtml += `<td class="col-pos" rowspan="${posInfo.rowspan}">${posInfo.text}</td>`;
                    }

                    rowsHtml += `<td class="col-def">${sense.def}</td>`;

                    rowsHtml += `
                        <td class="col-ops">
                            <button class="delete-btn" onclick="deleteSenseItem(${item.originalIndex}, ${sIdx})">刪除</button>
                        </td>
                    `;

                    rowsHtml += '</tr>';
                });

                li.innerHTML = `
                    <div class="drag-bar">☰</div>
                    <table class="word-table">
                        <tbody>${rowsHtml}</tbody>
                    </table>
                `;

                li.addEventListener("dragstart", handleDragStart);
                li.addEventListener("dragover", handleDragOver);
                li.addEventListener("dragleave", handleDragLeave);
                li.addEventListener("drop", handleDrop);
                li.addEventListener("dragend", handleDragEnd);

                const dragHandle = li.querySelector('.drag-bar');
                dragHandle.addEventListener('touchstart', handleTouchStart, { passive: false });
                dragHandle.addEventListener('touchmove', handleTouchMove, { passive: false });
                dragHandle.addEventListener('touchend', handleTouchEnd);

                ul.appendChild(li);
            });

            section.appendChild(ul);
            container.appendChild(section);
        });
    }

    let draggedItemIndex = null;

    function handleDragStart(e) {
        draggedItemIndex = Number(this.dataset.index);
        this.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
    }

    function handleDragOver(e) {
        e.preventDefault();
        this.classList.add("drag-over");
        e.dataTransfer.dropEffect = "move";
    }

    function handleDragLeave() {
        this.classList.remove("drag-over");
    }

    function handleDrop(e) {
        e.preventDefault();
        this.classList.remove("drag-over");
        const targetIndex = Number(this.dataset.index);
        if (draggedItemIndex !== null && draggedItemIndex !== targetIndex) {
            const movedItem = words.splice(draggedItemIndex, 1)[0];
            words.splice(targetIndex, 0, movedItem);
            saveStorage();
            renderList();
        }
    }

    function handleDragEnd() {
        this.classList.remove("dragging");
        document.querySelectorAll('.word-card-item').forEach(el => el.classList.remove('drag-over'));
        draggedItemIndex = null;
    }

    let touchSourceCard = null;
    let touchOverCard = null;

    function handleTouchStart(e) {
        e.preventDefault();
        touchSourceCard = this.closest('.word-card-item');
        if (touchSourceCard) {
            touchSourceCard.classList.add('dragging');
        }
    }

    function handleTouchMove(e) {
        e.preventDefault();
        if (!touchSourceCard) return;
        const touch = e.touches[0];
        const elementUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);
        const cardUnderTouch = elementUnderTouch ? elementUnderTouch.closest('.word-card-item') : null;

        document.querySelectorAll('.word-card-item').forEach(el => {
            if (el !== cardUnderTouch) el.classList.remove('drag-over');
        });

        if (cardUnderTouch && cardUnderTouch !== touchSourceCard) {
            cardUnderTouch.classList.add('drag-over');
            touchOverCard = cardUnderTouch;
        } else {
            touchOverCard = null;
        }
    }

    function handleTouchEnd(e) {
        if (!touchSourceCard) return;
        touchSourceCard.classList.remove('dragging');

        if (touchOverCard && touchOverCard !== touchSourceCard) {
            const fromIndex = Number(touchSourceCard.dataset.index);
            const toIndex = Number(touchOverCard.dataset.index);
            if (!isNaN(fromIndex) && !isNaN(toIndex)) {
                const movedItem = words.splice(fromIndex, 1)[0];
                words.splice(toIndex, 0, movedItem);
                saveStorage();
                renderList();
            }
        }

        document.querySelectorAll('.word-card-item').forEach(el => el.classList.remove('drag-over'));
        touchSourceCard = null;
        touchOverCard = null;
    }

    function buildGroupedTableHTML() {
        if (words.length === 0) {
            return '<div style="text-align:center; padding:20px; color:#999;">無單字資料</div>';
        }

        const groups = getGroupedWords();
        const sortedLetters = Object.keys(groups).sort((a, b) => {
            if (a === '#') return 1;
            if (b === '#') return -1;
            return a.localeCompare(b);
        });

        let html = '';
        sortedLetters.forEach((letter) => {
            html += `<div class="pdf-group-title">${letter}</div>`;
            groups[letter].forEach((item) => {
                const totalRows = item.senses.length;
                const posGroups = calculatePosRowspans(item);
                let rowsHtml = '';

                item.senses.forEach((sense, sIdx) => {
                    rowsHtml += '<tr>';
                    if (sIdx === 0) {
                        rowsHtml += `<td style="width: 32%; font-weight: 600; font-size: 16px;" rowspan="${totalRows}">${item.word}</td>`;
                    }
                    const posInfo = posGroups[sIdx];
                    if (posInfo.rowspan > 0) {
                        rowsHtml += `<td style="width: 28%; font-weight: 500;" rowspan="${posInfo.rowspan}">${posInfo.text}</td>`;
                    }
                    rowsHtml += `<td style="width: 40%;">${sense.def}</td>`;
                    rowsHtml += '</tr>';
                });

                html += `<table class="pdf-word-block"><tbody>${rowsHtml}</tbody></table>`;
            });
        });
        return html;
    }

    function openPreview() {
        const previewContainer = document.getElementById("previewGroupedContainer");
        previewContainer.innerHTML = buildGroupedTableHTML();
        document.getElementById("previewModal").style.display = "flex";
    }

    function closePreview() {
        document.getElementById("previewModal").style.display = "none";
    }

    function exportPDF() {
        if (words.length === 0) {
            alert("目前沒有單字可供輸出成 PDF！");
            return;
        }

        const exportContainer = document.getElementById("pdfExportContainer");
        exportContainer.innerHTML = `
            <div style="padding: 20px; background: #fff;">
                <h2 style="text-align: center; margin-bottom: 20px; color: #2c3e50;">大海的學測英文單字庫</h2>
                ${buildGroupedTableHTML()}
            </div>
        `;
        exportContainer.style.display = "block";

        const opt = {
            margin:       10,
            filename:     '大海的學測英文單字庫.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(exportContainer).save().then(() => {
            exportContainer.style.display = "none";
            exportContainer.innerHTML = "";
        });
    }

    renderList();
    loadFromFirebase();
</script>

</body>
</html>
