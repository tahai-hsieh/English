<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大海的學測英文單字庫</title>

    <meta name="apple-mobile-web-app-title" content="大海的學測英文單字庫">
    <meta name="application-name" content="大海的學測英文單字庫">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icon_English.png">

    <link rel="icon" id="dynamic-favicon" type="image/png" href="icon_English.png">

    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E5%A4%A7%E6%B5%B7%E7%9A%84%E5%AD%B8%E6%88%90%E8%8B%B1%E6%96%87%E5%96%AE%E5%AD%97%E5%BA%AB%22%2C%22short_name%22%3A%22%E5%A4%A7%E6%B5%B7%E7%9A%84%E5%AD%B8%E6%88%90%E8%8B%B1%E6%96%87%E5%96%AE%E5%AD%97%E5%BA%AB%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f6f9%22%2C%22theme_color%22%3A%22%233498db%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22icon_English.png%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: pan-y;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 24px 12px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 16px;
            color: #2c3e50;
            font-size: 24px;
            word-break: break-word;
        }

        .sync-status {
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .input-group input, .input-group select {
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        #wordInput { flex: 2; min-width: 140px; }
        #posSelect { flex: 1; min-width: 110px; }
        #defInput { flex: 3; min-width: 160px; }

        .btn {
            padding: 10px 16px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            text-align: center;
        }

        .btn-primary { background-color: #3498db; color: #fff; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #6c757d; color: #fff; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-preview { background-color: #2ecc71; color: #fff; }
        .btn-preview:hover { background-color: #27ae60; }
        .btn-export { background-color: #e67e22; color: #fff; }
        .btn-export:hover { background-color: #d35400; }

        .action-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* 字母分組樣式 */
        .alphabet-section {
            margin-bottom: 20px;
        }

        .alphabet-header {
            font-size: 20px;
            font-weight: 700;
            color: #e74c3c;
            border-bottom: 2px solid #e74c3c;
            padding-bottom: 4px;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .word-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 14px;
            border-radius: 6px;
            cursor: grab;
            user-select: none;
            gap: 8px;
        }

        .word-item.dragging {
            opacity: 0.4;
            background-color: #e3f2fd;
        }

        .drag-handle {
            color: #aaa;
            margin-right: 6px;
            cursor: grab;
            flex-shrink: 0;
        }

        .word-content {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex: 1;
            flex-wrap: wrap;
            word-break: break-word;
        }

        .word-text { font-size: 16px; font-weight: 600; color: #2c3e50; }
        .part-of-speech { font-size: 13px; color: #7f8c8d; font-style: italic; }
        .definition { font-size: 14px; color: #34495e; }

        .delete-btn {
            background-color: transparent;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .delete-btn:hover { background-color: #e74c3c; color: #fff; }

        /* 預覽視窗 */
        #previewModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* 預覽與 PDF 列印樣式 */
        .pdf-group-title {
            font-size: 16px;
            font-weight: bold;
            color: #e74c3c;
            padding: 12px 0 6px 0;
            border-bottom: 2px solid #e74c3c;
            margin-bottom: 8px;
        }

        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-bottom: 12px;
        }

        .pdf-table th, .pdf-table td {
            border: 1px solid #ddd;
            padding: 8px 10px;
            text-align: left;
            word-wrap: break-word;
        }

        .pdf-table th {
            background-color: #f4f6f9;
            font-weight: 600;
        }

        .empty-tip {
            text-align: center;
            color: #999;
            padding: 20px 0;
        }

        @media (max-width: 600px) {
            body { padding: 12px 8px; }
            .container { padding: 16px; }
            h1 { font-size: 20px; }
            .input-group { flex-direction: column; gap: 8px; }
            #wordInput, #posSelect, #defInput, .input-group .btn-primary { width: 100%; min-width: 0; }
            .action-bar { flex-direction: column; }
            .action-bar .btn { width: 100%; }
            .word-content { gap: 4px; }
            .word-text { font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>大海的學測英文單字庫</h1>
    <div class="sync-status" id="syncStatus">雲端狀態：連線中...</div>

    <!-- 輸入區 -->
    <div class="input-group">
        <input type="text" id="wordInput" placeholder="英文單字 (例: Apple)">
        <select id="posSelect">
            <option value="n.">n. 名詞</option>
            <option value="v.">v. 動詞</option>
            <option value="adj.">adj. 形容詞</option>
            <option value="adv.">adv. 副詞</option>
            <option value="prep.">prep. 介系詞</option>
            <option value="conj.">conj. 連接詞</option>
            <option value="phr.">phr. 片語</option>
        </select>
        <input type="text" id="defInput" placeholder="中文解釋 (例: 蘋果)">
        <button class="btn btn-primary" onclick="addWord()">新增</button>
    </div>

    <!-- 工具按鈕列（輸出按鈕已直接置於第一頁） -->
    <div class="action-bar">
        <button class="btn btn-secondary" onclick="autoGroupAndSort()">重新自動排列</button>
        <button class="btn btn-preview" onclick="openPreview()">預覽輸出</button>
        <button class="btn btn-export" onclick="exportPDF()">輸出成 PDF</button>
    </div>

    <!-- 按 A-Z 字母群組容器 -->
    <div id="groupedWordContainer"></div>
</div>

<!-- 預覽視窗 -->
<div id="previewModal">
    <div class="modal-card">
        <div class="modal-header">
            <h2>預覽清單（唯讀模式）</h2>
        </div>
        <div class="modal-body" id="previewContentArea">
            <h3 style="text-align: center; margin-bottom: 15px;">大海的學測英文單字庫</h3>
            <div id="previewGroupedContainer"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closePreview()">關閉預覽</button>
        </div>
    </div>
</div>

<!-- 隱藏的 PDF 渲染專用容器 -->
<div id="pdfExportContainer" style="display: none;"></div>

<script>
    const DB_URL = "https://english-tahai-default-rtdb.asia-southeast1.firebasedatabase.app/words.json";

    function setCircularFavicon(imageUrl) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = imageUrl;
        img.onload = () => {
            const canvas = document.createElement("canvas");
            const size = 64;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");

            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(img, 0, 0, size, size);

            const dynamicFavicon = document.getElementById("dynamic-favicon");
            if (dynamicFavicon) {
                dynamicFavicon.href = canvas.toDataURL("image/png");
            }
        };
    }
    setCircularFavicon("icon_English.png");

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                const CACHE_NAME = 'vocab-cache-v5';
                const ASSETS = [
                    './',
                    './index.html',
                    './icon_English.png',
                    'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'
                ];
                self.addEventListener('install', (e) => {
                    e.waitUntil(
                        caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS)).then(() => self.skipWaiting())
                    );
                });
                self.addEventListener('activate', (e) => {
                    e.waitUntil(
                        caches.keys().then((keys) => {
                            return Promise.all(keys.map((k) => { if (k !== CACHE_NAME) return caches.delete(k); }));
                        }).then(() => self.clients.claim())
                    );
                });
                self.addEventListener('fetch', (e) => {
                    if (e.request.url.includes('firebasedatabase.app')) {
                        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                    } else {
                        e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
                    }
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch((err) => {
                console.log('SW registration note:', err);
            });
        });
    }

    let words = JSON.parse(localStorage.getItem("vocabularyList")) || [];

    function updateStatus(text, isError = false) {
        const status = document.getElementById("syncStatus");
        status.textContent = text;
        status.style.color = isError ? "#e74c3c" : "#7f8c8d";
    }

    async function saveStorage() {
        localStorage.setItem("vocabularyList", JSON.stringify(words));
        updateStatus("正在同步至雲端...");
        try {
            const res = await fetch(DB_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(words)
            });
            if (res.ok) {
                updateStatus("雲端狀態：已同步完成");
            } else {
                updateStatus("雲端狀態：同步失敗（請檢查 Firebase 權限規則）", true);
            }
        } catch (err) {
            updateStatus("雲端狀態：離線模式（已暫存本機）");
        }
    }

    async function loadFromFirebase() {
        updateStatus("雲端狀態：正在從雲端載入資料...");
        try {
            const res = await fetch(DB_URL);
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data)) {
                    words = data;
                } else if (data && typeof data === 'object') {
                    words = Object.values(data);
                } else if (data === null) {
                    words = JSON.parse(localStorage.getItem("vocabularyList")) || [];
                }
                localStorage.setItem("vocabularyList", JSON.stringify(words));
                updateStatus("雲端狀態：已連線並同步最新資料");
                renderList();
            } else {
                updateStatus("雲端狀態：讀取失敗，使用本機暫存資料", true);
            }
        } catch (err) {
            updateStatus("雲端狀態：離線模式，使用本機暫存資料");
        }
    }

    function performSort() {
        words.sort((a, b) => {
            const wordA = a.word.toLowerCase();
            const wordB = b.word.toLowerCase();

            const prefixLen = 3;
            const prefixA = wordA.slice(0, prefixLen);
            const prefixB = wordB.slice(0, prefixLen);

            if (prefixA === prefixB) {
                return wordA.localeCompare(wordB);
            }
            return wordA.localeCompare(wordB);
        });
    }

    function autoGroupAndSort() {
        performSort();
        saveStorage();
        renderList();
    }

    function addWord() {
        const wordInput = document.getElementById("wordInput");
        const posSelect = document.getElementById("posSelect");
        const defInput = document.getElementById("defInput");

        const word = wordInput.value.trim();
        const pos = posSelect.value;
        const def = defInput.value.trim();

        if (!word || !def) {
            alert("請填寫單字與中文解釋！");
            return;
        }

        words.push({ word, pos, def });
        performSort();
        saveStorage();
        renderList();

        wordInput.value = "";
        defInput.value = "";
        wordInput.focus();
    }

    let isComposing = false;
    function handleCompositionStart() { isComposing = true; }
    function handleCompositionEnd() { isComposing = false; }

    function handleKeyDown(e) {
        if (e.isComposing || isComposing || e.keyCode === 229) return;
        if (e.key === "Enter") {
            e.preventDefault();
            addWord();
        }
    }

    const wordInputEl = document.getElementById("wordInput");
    const defInputEl = document.getElementById("defInput");
    [wordInputEl, defInputEl].forEach((input) => {
        input.addEventListener("compositionstart", handleCompositionStart);
        input.addEventListener("compositionend", handleCompositionEnd);
        input.addEventListener("keydown", handleKeyDown);
    });

    function deleteWord(originalIndex) {
        words.splice(originalIndex, 1);
        saveStorage();
        renderList();
    }

    // 將單字依照開頭字母 A-Z 分組（非英文字母歸入 #）
    function getGroupedWords() {
        const groups = {};
        words.forEach((item, index) => {
            const firstChar = (item.word.trim().charAt(0) || '#').toUpperCase();
            const letter = /^[A-Z]$/.test(firstChar) ? firstChar : '#';
            if (!groups[letter]) {
                groups[letter] = [];
            }
            groups[letter].push({ ...item, originalIndex: index });
        });
        return groups;
    }

    function renderList() {
        const container = document.getElementById("groupedWordContainer");
        container.innerHTML = "";

        if (words.length === 0) {
            container.innerHTML = '<div class="empty-tip">目前尚無單字，請從上方輸入新增。</div>';
            return;
        }

        const groups = getGroupedWords();
        const sortedLetters = Object.keys(groups).sort((a, b) => {
            if (a === '#') return 1;
            if (b === '#') return -1;
            return a.localeCompare(b);
        });

        sortedLetters.forEach((letter) => {
            const section = document.createElement("div");
            section.className = "alphabet-section";

            const header = document.createElement("div");
            header.className = "alphabet-header";
            header.textContent = letter;
            section.appendChild(header);

            const ul = document.createElement("ul");
            ul.className = "word-list";

            groups[letter].forEach((item) => {
                const li = document.createElement("li");
                li.className = "word-item";
                li.draggable = true;
                li.dataset.index = item.originalIndex;

                li.innerHTML = `
                    <div class="word-content">
                        <span class="drag-handle">☰</span>
                        <span class="word-text">${item.word}</span>
                        <span class="part-of-speech">${item.pos}</span>
                        <span class="definition">${item.def}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteWord(${item.originalIndex})">刪除</button>
                `;

                li.addEventListener("dragstart", handleDragStart);
                li.addEventListener("dragover", handleDragOver);
                li.addEventListener("drop", handleDrop);
                li.addEventListener("dragend", handleDragEnd);

                ul.appendChild(li);
            });

            section.appendChild(ul);
            container.appendChild(section);
        });
    }

    let draggedItemIndex = null;

    function handleDragStart(e) {
        draggedItemIndex = Number(this.dataset.index);
        this.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
    }

    function handleDrop(e) {
        e.preventDefault();
        const targetIndex = Number(this.dataset.index);
        if (draggedItemIndex !== null && draggedItemIndex !== targetIndex) {
            const movedItem = words.splice(draggedItemIndex, 1)[0];
            words.splice(targetIndex, 0, movedItem);
            saveStorage();
            renderList();
        }
    }

    function handleDragEnd() {
        this.classList.remove("dragging");
        draggedItemIndex = null;
    }

    // 產生預覽與 PDF 共用的表格結構
    function buildGroupedTableHTML() {
        if (words.length === 0) {
            return '<div style="text-align:center; padding:20px; color:#999;">無單字資料</div>';
        }

        const groups = getGroupedWords();
        const sortedLetters = Object.keys(groups).sort((a, b) => {
            if (a === '#') return 1;
            if (b === '#') return -1;
            return a.localeCompare(b);
        });

        let html = '';
        sortedLetters.forEach((letter) => {
            html += `<div class="pdf-group-title">${letter}</div>`;
            html += `
                <table class="pdf-table">
                    <thead>
                        <tr>
                            <th style="width: 12%;">#</th>
                            <th style="width: 33%;">單字</th>
                            <th style="width: 18%;">詞性</th>
                            <th style="width: 37%;">解釋</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            groups[letter].forEach((item, idx) => {
                html += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td style="font-weight:600;">${item.word}</td>
                        <td>${item.pos}</td>
                        <td>${item.def}</td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
        });
        return html;
    }

    function openPreview() {
        const previewContainer = document.getElementById("previewGroupedContainer");
        previewContainer.innerHTML = buildGroupedTableHTML();
        document.getElementById("previewModal").style.display = "flex";
    }

    function closePreview() {
        document.getElementById("previewModal").style.display = "none";
    }

    // 第一頁直接觸發 PDF 輸出
    function exportPDF() {
        if (words.length === 0) {
            alert("目前沒有單字可供輸出成 PDF！");
            return;
        }

        const exportContainer = document.getElementById("pdfExportContainer");
        exportContainer.innerHTML = `
            <div style="padding: 20px; background: #fff;">
                <h2 style="text-align: center; margin-bottom: 20px; color: #2c3e50;">大海的學測英文單字庫</h2>
                ${buildGroupedTableHTML()}
            </div>
        `;
        exportContainer.style.display = "block";

        const opt = {
            margin:       10,
            filename:     '大海的學測英文單字庫.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(exportContainer).save().then(() => {
            exportContainer.style.display = "none";
            exportContainer.innerHTML = "";
        });
    }

    renderList();
    loadFromFirebase();
</script>

</body>
</html>
